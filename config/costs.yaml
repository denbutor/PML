# ==============================================================================
# ЛАБОРАТОРНА РОБОТА №3 | КРОК 5: ОЦІНКА ФІНАНСОВИХ РИЗИКІВ ТА НАЛАШТУВАННЯ ВАГ
# ==============================================================================
# Детальний аналіз та вихідні дані наведені у файлі docs/lab3_report.md, §5.
# Масштаб валюти (у.о.) еквівалентний показнику CashbackAmount.
# Сценарій: Модель виявляє схильність до відтоку -> менеджер застосовує
# інструмент утримання (індивідуальна бонусна програма).
# ==============================================================================

# Вхідні параметри бізнес-моделі
assumptions:
  offer_cost: 50            # V: Собівартість кампанії утримання на одного клієнта
  monthly_margin: 40        # M: Чистий щомісячний прибуток від одного користувача
  retained_months: 12       # L: Прогнозований період активності повернутого клієнта
  offer_success_rate: 0.35  # s: Ефективність спецпропозиції (акцептують 35% користувачів)

# Матриця витрат (C_ij: i — фактичний стан, j — вердикт алгоритму; де 1 — відтік)
# Базова цінність клієнта (CLV) = M * L = 40 * 12 = 480 у.о.
#
#  C00 = 0                           -> Правильне утримання: Клієнт стабільний, витрат немає
#  C01 = V = 50                      -> Зайві витрати: Лояльний клієнт безпідставно отримав бонус
#  C10 = CLV = 480                   -> Прямі збитки: Не помітили відтік, втратили клієнта (CLV)
#  C11 = V + (1 - s) * CLV           -> Часткове збереження: Витрата V, але відтік стається у (1-s) випадків
#        50 + 0.65 * 480 = 362 у.о.
matrix: {C00: 0, C01: 50, C10: 480, C11: 362}

# Розрахунок штрафних коефіцієнтів (class_weight) на основі ціни упущеної вигоди:
# Показує фінансові наслідки помилкового рішення у кожному класі.
#
#  w0 = C01 - C00 = 50               -> Штраф за хибнопозитивний опис (надлишкова комунікація)
#  w1 = C10 - C11 = 118              -> Штраф за хибнонегативний опис (реальні втрати відтоку)
#
# Математично обґрунтована межа розподілу для каліброваної моделі:
# T* = w0 / (w0 + w1) = 50 / (50 + 118) = 50 / 168 ≈ 0.30
class_weight: {0: 50, 1: 118}
