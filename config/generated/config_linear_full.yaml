feature_engineering:
- type: bins
  name: TenureStage
  source: Tenure
  edges:
  - 0
  - 1
  - 5
  - 12
  - 120
- type: ratio
  name: RecencyRatio
  numerator: DaySinceLastOrder
  denominator: Tenure
  denominator_scale: 30
  epsilon: 1.0
- type: ratio
  name: CashbackPerOrder
  numerator: CashbackAmount
  denominator: OrderCount
- type: ratio
  name: CouponPerOrder
  numerator: CouponUsed
  denominator: OrderCount
- type: ratio
  name: OrdersPerTenureMonth
  numerator: OrderCount
  denominator: Tenure
  epsilon: 1.0
- type: cross
  name: Segment
