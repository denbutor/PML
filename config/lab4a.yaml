# Лабораторна робота №4, напрямок 4A — напівкероване (semi-supervised) та активне (active) навчання.
data:
  rev: lab3-v1.0                # базовий знімок DVC з ЛР3 (git-тег); доступ дозволено виключно через dvc.api
  path: data/processed/train.csv

split:                          # етап DVC lab4a_split → формування data/processed/lab4a_split.csv
  test_share: 0.25              # валідаційний сет ЛР4A: для фінального оцінювання, мітки заблоковані для навчання
  seed: 42                      # залишок формує «pool»: джерело для розмічених (L) та нерозмічених (U) даних (оригінальні мітки виступають оракулом)

features:
  config: config/generated/config_rf_hermetic.yaml   # пайплайн обробки ознак з ЛР1–3 для Random Forest (розбиття простору)
  config_graph: config/generated/config_lr_hermetic.yaml  # для графового алгоритму обов'язкове масштабування ознак (адитивні моделі)
  filter_k: 30                  # SelectKBest(f_classif) — конфігурується ВИКЛЮЧНО на основі розмічених екземплярів

model:                          # базовий класифікатор — копія найкращої моделі з ЛР3 (reports/lab3_final_model.json)
  n_estimators: 281
  max_depth: 11
  class_weight: {0: 50, 1: 118}
  random_state: 42
  threshold: 0.46               # встановлений у ЛР3 поріг класифікації для максимізації F1 та мінімізації втрат

semi_supervised:
  label_fractions: [0.05, 0.10, 0.20, 0.50]   # відсоток початково розмічених об'єктів у пулі
  seeds: [0, 1, 2, 3, 4]                     # генератори випадковості для вибору L-набору → розрахунок середнього та відхилення
  self_training:                             # ключовий підхід до навчання (ТЗ 4A, модифікація 1)
    threshold: 0.90                          # зафіксовано до старту тестів; аналіз чутливості виконується окремо на фіксованій частці
    max_iter: 10
    sensitivity_thresholds: [0.70, 0.80, 0.90, 0.95]
    sensitivity_fraction: 0.10
  label_spreading:                           # альтернативний метод для зіставлення (ТЗ 4A, модифікація 3, на основі графів)
    kernel: knn
    n_neighbors: 20               # мінімальне k для забезпечення зв'язності kNN-графа в усьому пулі (без урахування міток); при k=10 лишається 2% ізольованих точок
    alpha: 0.2
    max_iter: 100

active_learning:                             # імітація експертного розмічування (модифікація 5) з автоматичним оракулом → перехідний етап до ЛР5
  initial_fraction: 0.05
  batch_size: 20
  rounds: 15                                 # ліміт на додавання нових міток дорівнює 300
  seeds: [0, 1, 2, 3, 4]
  strategies: [random, entropy, entropy_diversity]
  diversity_candidates: 100                  # для стратегії entropy_diversity: відбір топ-100 об'єктів з найвищою ентропією → KMeans(batch) → вибір найближчих до центроїдів
