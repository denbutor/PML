# ==============================================================================
# ЛАБОРАТОРНА РОБОТА №3 | ІЗОЛЬОВАНИЙ ПАЙПЛАЙН ТА ВКЛАДЕНА КРОС-ВАЛІДАЦІЯ
# ==============================================================================
# Конфігурація герметичного конвеєра для оптимізації гіперпараметрів.
# Гарантує повну відсутність витоку даних (Data Leakage) завдяки виконанню
# text-майнінгу, ресемплінгу та селекції ознак суворо всередині крос-валідаційних фолдів.
# ==============================================================================

# Стратегія первинного розподілу вибірки
split:
  # Ізольований Holdout-набір, що не бере участі в ЛР3 (ні для тренування, ні для підбору моделі).
  # Фіксується інструментом DVC як еталонний датасет для тестування у ЛР4 та ЛР5.
  holdout_share: 0.20
  seed: 42

# Блок обробки текстових ознак (ReviewTextSVD)
text_block:
  max_features: 500           # Обмеження словника для TF-IDF кодування
  n_components: 5             # Розмірність латентного простору після сингулярного розкладу (SVD)
  random_state: 42
  aggregations: [mean, max]   # Агрегаційні функції для перенесення текстових ембедінгів на рівень клієнта

# Модуль балансування класів (Обґрунтування вибору: docs/lab3_report.md, §3)
resampler:
  method: SMOTE
  sampling_strategy: 0.5      # Збільшення міноритарного класу до 50% від мажоритарного (частка ~33%).
                              # Штучний баланс 1:1 не створюється, оскільки далі діють cost-sensitive ваги.
  k_neighbors: 5              # Базова кількість сусідів; оптимізується через Optuna у межах [3, 10]
  random_state: 42

# Покроковий відбір інформативних ознак (Filter -> Wrapper)
# Усі етапи фільтрації та обгортки (Wrapper) інкапсульовані всередині поточного фолду.
selection:
  filter_k: 30                # Попередній відбір топ-30 ознак статистичним фільтром
  filter_score: f_classif     # Критерій f_classif замість mutual_info з ЛР2 (забезпечує стабільність та прискорення у ~35 разів)
  sfs_k_features: 15          # Фінальна кількість ознак після послідовного відбору (Sequential Feature Selector)
  sfs_cv: 3                   # Внутрішня крос-валідація для SFS-процедури
  sfs_scoring: roc_auc        # Метрика оцінки якості підмножин ознак

# Конфігурація вкладеної крос-валідації (Nested CV)
nested_cv:
  # Зовнішнє кільце: Оцінка загальної узагальнюючої здатності конвеєра
  outer: {splitter: StratifiedKFold, n_splits: 5, shuffle: true, random_state: 42}
  # Внутрішнє кільце: Валідація простору гіперпараметрів для кожної ітерації Optuna
  inner: {splitter: StratifiedKFold, n_splits: 3, shuffle: true, random_state: 42}
  optimizer: optuna           # Алгоритм TPE (Tree-structured Parzen Estimator)
  n_trials: 30                # Загальна кількість ітерацій пошуку для кожного алгоритму
  objective: roc_auc          # Порогово-незалежний критерій оптимізації; фінальний бізнес-поріг налаштовується окремо
  sampler_seed: 42            # Забезпечення детермінованості процесу випадкового пошуку

# Простір пошуку гіперпараметрів (Search Space)
# Включає параметри як самих класифікаторів, так і конвеєрного кроку ресемплінгу (k_neighbors).
search_space:
  # Логістична регресія (Linear Model)
  LR:
    C: {low: 1.0e-4, high: 1.0e+2, log: true}
    penalty: [l1, l2]
    k_neighbors: {low: 3, high: 10}
  # Випадковий ліс (Ensemble Model)
  RF:
    n_estimators: {low: 100, high: 500}
    max_depth: {low: 3, high: 20}
    k_neighbors: {low: 3, high: 10}

# Директорія кешування проміжних обчислень
cache_dir: data/processed/joblib_cache   # Зберігає результати стабільних кроків (prep/filter/SFS) для прискорення ітерацій Optuna
